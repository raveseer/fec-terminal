services:
  fec-terminal:
    build: .
    container_name: fec-terminal
    ports:
      - "3210:3000"
    environment:
      # Free key: https://api.data.gov/signup/ (1,000 req/hr vs DEMO_KEY's ~30)
      - FEC_API_KEY=${FEC_API_KEY:-DEMO_KEY}
      # FEC responses cached 6h by default (campaign data updates ~daily)
      - CACHE_TTL_MS=${CACHE_TTL_MS:-21600000}
      - DATA_DIR=/app/data
      # Local AI via Ollama on the host
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      # Ask AI agent: tool-calling model + optional web search provider/key
      - OLLAMA_TOOL_MODEL=${OLLAMA_TOOL_MODEL:-mistral-small3.2:latest}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-tavily}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      # 10 min — cold model loads + long prompts on CPU can blow past shorter timeouts
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-600000}
      # FEC /elections/ (Senate especially) is slow — 60s default
      - FEC_FETCH_TIMEOUT_MS=${FEC_FETCH_TIMEOUT_MS:-60000}
    volumes:
      # persists the sqlite cache + settings (model choice) across rebuilds
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
